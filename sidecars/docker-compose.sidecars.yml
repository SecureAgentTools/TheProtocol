# §ONESHOT P2.2 (2026-09-12) — THE SIDECARS A FRAME IS WIRED INTO, AS ONE COMPOSE PROJECT.
#
# A frame stood up by scripts/hetzner_demo/standup_driver.py needs four things that are not part of
# the frame: something that scrapes it (Prometheus + vmalert), an independent auditor that reads its
# ledger (Agents/TheAuditor), a federated index with its own identity (directory/), and a host-side
# refresh of its SPIRE trust bundle (scripts/deploy/frame-spire-bundle.sh, a cron, not a container:
# host nginx must reload). On theprotocol-srv1 these run as separate, older projects and
# sidecars/sidecars.json names them; a NEW host stands up THIS project once and points sidecars.json
# (from sidecars.json.example) at it. --wire-prod then writes the frame's slot into each (sidecars.py).
#
# ⚠ The project name is pinned: copying a file that declares `directory` or `auditor` into a folder
# that already has one ADOPTS the running container (directory/docker-compose.directory.yml's header).
name: tp-sidecars
services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: tp-sidecars-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=${SIDECARS_PROM_RETENTION:-30d}'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      # one JSON file per frame, written by sidecars.wire(); no config edit, no restart (file_sd)
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - tp-sidecars-prom-data:/prometheus
    ports:
      - "127.0.0.1:${SIDECARS_PROM_PORT:-9190}:9090"
    networks:
      - default
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  vmalert:
    image: victoriametrics/vmalert:v1.99.0
    container_name: tp-sidecars-vmalert
    restart: unless-stopped
    command:
      - '-datasource.url=http://prometheus:9090'
      - '-rule=/etc/vmalert/rules/*.yml'
      - '-notifier.url=${SIDECARS_ALERTMANAGER_URL:-http://alertmanager:9093}'
      - '-httpListenAddr=:8880'
      - '-evaluationInterval=30s'
    volumes:
      - ./vmalert/rules:/etc/vmalert/rules:ro
    ports:
      - "127.0.0.1:${SIDECARS_VMALERT_PORT:-8881}:8880"
    depends_on:
      - prometheus
    networks:
      - default
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  auditor:
    build: ../Agents/TheAuditor
    container_name: tp-sidecars-auditor
    restart: unless-stopped
    env_file:
      - path: .env.sidecars
        required: false   # sidecars.wire() creates it (600); the example is beside it
    environment:
      AGENT_NAME: ${SIDECARS_AUDITOR_NAME:-TheAuditor}
      AUDIT_INTERVAL: ${SIDECARS_AUDIT_INTERVAL:-3600}
      # the frames this auditor audits: sidecars.wire() upserts one entry per frame (DSNs read from
      # the frame's own containers, never typed); the value lives in .env.sidecars (600)
      AUDITOR_EXTRA_FRAMES_JSON: ${AUDITOR_EXTRA_FRAMES_JSON:-[]}
      # §FRAMEKIT P3.1: the same list as a FILE (auditor/frames/frames.json, 600), re-read on POST /api/auditor/admin/reload-frames
      AUDITOR_EXTRA_FRAMES_FILE: /app/frames/frames.json
      MAINTENANCE_ACTIVE: ${MAINTENANCE_ACTIVE:-false}
      AUDITOR_ADMIN_TOKEN: ${AUDITOR_ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:${SIDECARS_AUDITOR_PORT:-8045}:8045"
    volumes:
      - tp-sidecars-auditor-data:/app/data
      - ./auditor/frames:/app/frames:ro
    networks:
      - default
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  directory:
    build: ../directory
    container_name: tp-sidecars-directory
    restart: unless-stopped
    env_file:
      - path: .env.sidecars
        required: false   # sidecars.wire() creates it (600); the example is beside it
    ports:
      - "127.0.0.1:${SIDECARS_DIRECTORY_PORT:-8600}:8600"
    volumes:
      - tp-sidecars-directory-data:/data
    networks:
      - default
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # §FRAMEKIT P3.1 (2026-09-12) — where the alerts go and where the dashboards live. alertmanager.yml
  # ships the ROUTES (page|critical first); the receivers' integrations are yours to name in it. Grafana
  # provisions the Prometheus datasource (uid DS_PROMETHEUS) and grafana/provisioning/dashboards/json/
  # (Frames/frame-overview.json, generated by scripts/hetzner_demo/frame_dashboard.py).
  # ⚠ git does not keep file modes and this tree's umask writes 640: `chmod -R a+rX sidecars/` after a
  # checkout, or Prometheus (nobody), Grafana (472) and alertmanager (nobody) cannot read their mounts.
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: tp-sidecars-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - tp-sidecars-am-data:/alertmanager
    ports:
      - "127.0.0.1:${SIDECARS_ALERTMANAGER_PORT:-9094}:9093"
    networks:
      - default
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  grafana:
    image: grafana/grafana:10.0.0
    container_name: tp-sidecars-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${SIDECARS_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${SIDECARS_GRAFANA_ADMIN_PASSWORD:?set SIDECARS_GRAFANA_ADMIN_PASSWORD in .env.sidecars (600); there is no default}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - tp-sidecars-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${SIDECARS_GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - default
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  tp-sidecars-prom-data:
  tp-sidecars-auditor-data:
  tp-sidecars-directory-data:
  tp-sidecars-am-data:
  tp-sidecars-grafana-data:

networks:
  default:
    name: tp-sidecars
