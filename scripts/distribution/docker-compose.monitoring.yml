# docker-compose.monitoring.yml — TheProtocol monitoring stack for the standalone compose (§SOVKIT 2026-09-14).
# Use it WITH the standalone compose, as a second file of the same project (the services join its operator-net):
#   docker compose -f docker-compose.standalone.yml -f docker-compose.monitoring.yml --env-file .env.operator up -d
# Prometheus scrapes the registry, TEG, event store, the solo auditor and OPA (monitoring/prometheus.yml), evaluates the
# frame rules shipped with the frame kit (monitoring/rules/frames.yml) and pages the Alertmanager beside it; Grafana is
# provisioned with the Prometheus datasource and the frame-overview dashboard. The earlier version of this file mounted
# a prometheus.yml and an alertmanager.yml that did not exist and declared the network external, so it could not start.

services:
  # ────────────────────────────────────────────────────────────
  # Prometheus — Metrics collection + rule evaluation
  # ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ${REGISTRY_NAME:-operator}-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_HTTP_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - operator-net

  # ────────────────────────────────────────────────────────────
  # Grafana — Dashboards (datasource + frame overview provisioned)
  # ────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: ${REGISTRY_NAME:-operator}-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_HTTP_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - operator-net

  # ────────────────────────────────────────────────────────────
  # Alertmanager — Alert routing (page|critical first, the kit's routes)
  # ────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ${REGISTRY_NAME:-operator}-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ALERTMANAGER_HTTP_PORT:-9093}:9093"
    volumes:
      - alertmanager-data:/alertmanager
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - operator-net

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

networks:
  operator-net: {}
