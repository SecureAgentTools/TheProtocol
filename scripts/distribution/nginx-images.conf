# nginx-images.conf — Reverse proxy for TheProtocol Docker Registry
# Install at: /etc/nginx/sites-available/images.theprotocol.cloud
# Symlink to: /etc/nginx/sites-enabled/

server {
    listen 443 ssl http2;
    server_name images.theprotocol.cloud;

    # TLS (Let's Encrypt — certbot will fill these)
    ssl_certificate /etc/letsencrypt/live/images.theprotocol.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/images.theprotocol.cloud/privkey.pem;

    # Docker registry requires chunked transfer encoding
    client_max_body_size 0;
    chunked_transfer_encoding on;

    location /v2/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
    }

    # Health check (unauthenticated)
    location /v2/_health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $http_host;
    }
}

server {
    listen 80;
    server_name images.theprotocol.cloud;
    return 301 https://$host$request_uri;
}
