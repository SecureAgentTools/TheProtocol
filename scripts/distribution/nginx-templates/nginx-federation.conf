# =============================================================
# nginx mTLS Federation Sidecar — Operator Registry
# =============================================================
# Presents the operator's SPIRE SVID as server certificate.
# Validates client certificates from peer registries (mTLS).
# Proxies federation + cross-TEG endpoints to local services.
# =============================================================

# Health check server (plain HTTP, no mTLS)
server {
    listen 8080;
    server_name _;

    location /health {
        return 200 '{"status":"healthy","service":"nginx-operator","mode":"mtls-sidecar"}\n';
        add_header Content-Type application/json;
    }
}

# Main server block — mTLS federation proxy
server {
    listen 8443 ssl;
    server_name nginx-federation;

    # --- Server Certificate (SPIRE SVID from cert-writer) ---
    ssl_certificate       /certs/svid.0.pem;
    ssl_certificate_key   /certs/svid.0.key;

    # --- Client Certificate Verification (mTLS) ---
    # Trust bundle from SPIRE — contains the CA that signed peer SVIDs
    ssl_client_certificate /certs/bundle.0.pem;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    # Docker DNS resolver — required for variable upstreams to avoid startup race
    # condition where nginx validates config before Docker DNS is ready
    resolver 127.0.0.11 valid=10s;

    # --- TLS Protocol Settings ---
    ssl_protocols          TLSv1.3;
    ssl_ciphers            HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache      shared:SSL:1m;
    ssl_session_timeout    5m;

    # --- Federation Sync Endpoints ---
    location /api/v1/federation/ {
        set $upstream_registry registry;
        proxy_pass http://$upstream_registry:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Client certificate forwarding for SPIFFE ID extraction
        proxy_set_header X-SSL-Client-Cert   $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
        # §MTLSHOPS (2026-09-16): this operator's marker; the app counts X-SSL-* only with it (keep this file 600)
        #OPDIST-MARKER# proxy_set_header X-Registry-Proxy-Auth "__REGISTRY_PROXY_TRUST_SECRET__";

        # Clear internal auth headers to prevent bypass
        proxy_set_header X-Federation-Secret    "";
        proxy_set_header X-Federation-SPIFFE-ID "";

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }

    # Registry Card v0.3 (2026-05-21, §pass60) — public well-known endpoints
    # proxied via mTLS so federation peers can fetch card body, JWKS, and
    # schema over the same trust fabric used for agent-card sync.
    location ~ ^/\.well-known/(registry-card\.json|registry-jwks\.json|registry-card-schema\.json)$ {
        set $upstream_rc registry;
        proxy_pass http://$upstream_rc:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert   $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
        # §MTLSHOPS (2026-09-16): this operator's marker; the app counts X-SSL-* only with it (keep this file 600)
        #OPDIST-MARKER# proxy_set_header X-Registry-Proxy-Auth "__REGISTRY_PROXY_TRUST_SECRET__";
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # --- Cross-TEG Transfer Endpoints ---
    location /api/v1/cross-teg/ {
        set $upstream_teg teg-layer;
        proxy_pass http://$upstream_teg:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Client certificate forwarding for mTLS authentication
        proxy_set_header X-SSL-Client-Cert   $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
        # §MTLSHOPS (2026-09-16): this operator's marker; the app counts X-SSL-* only with it (keep this file 600)
        #OPDIST-MARKER# proxy_set_header X-TEG-Proxy-Auth "__TEG_PROXY_TRUST_SECRET__";

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }

    # --- Canary mTLS path (§pass21, 2026-05-16) ---
    # Routes canary fires via mTLS-terminated sidecar so SPIRE SVIDs are
    # exercised by synthetic traffic each cycle. Transport-only mTLS:
    # registry still authenticates the Bearer agent JWT in the upstream HTTP path.
    location = /api/v1/teg/transfer {
        proxy_pass http://registry:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert   $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
        # §MTLSHOPS (2026-09-16): this operator's marker; the app counts X-SSL-* only with it (keep this file 600)
        #OPDIST-MARKER# proxy_set_header X-Registry-Proxy-Auth "__REGISTRY_PROXY_TRUST_SECRET__";
        proxy_set_header X-Federation-Secret    "";
        proxy_set_header X-Federation-SPIFFE-ID "";
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }
    location = /api/v1/teg/cross-registry-transfer {
        proxy_pass http://registry:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert   $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
        # §MTLSHOPS (2026-09-16): this operator's marker; the app counts X-SSL-* only with it (keep this file 600)
        #OPDIST-MARKER# proxy_set_header X-Registry-Proxy-Auth "__REGISTRY_PROXY_TRUST_SECRET__";
        proxy_set_header X-Federation-Secret    "";
        proxy_set_header X-Federation-SPIFFE-ID "";
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }

    # --- Cross-TEG Balance Sync ---
    location /api/v1/teg/cross-teg-balance-sync {
        proxy_pass http://registry:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        # §MTLSHOPS (2026-09-16): this operator's marker; the app counts X-SSL-* only with it (keep this file 600)
        #OPDIST-MARKER# proxy_set_header X-Registry-Proxy-Auth "__REGISTRY_PROXY_TRUST_SECRET__";
    }

    # Catch-all: reject non-federation paths
    location / {
        return 404 '{"error":"Only federation and cross-TEG endpoints are served via mTLS proxy"}\n';
        add_header Content-Type application/json;
    }
}
