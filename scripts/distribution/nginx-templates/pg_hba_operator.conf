# §OPDIST (2026-09-16, agentvault2-6a with agentvault2-b5): the operator's registry database, with the db-TLS override.
#
# SCOPED on purpose (agentvault2-b5's decision, option ii). The hop that must be authenticated is the one that leaves the
# operator's compose network: the FRAME's auditor reading the share register as auditor_ro. It connects only over TLS,
# with a client certificate chaining to the data identity's bundle (the parent frame's own root; the data entry is never
# federated) AND the role's password. Every other role keeps the image's own rules: pgbouncer and the registry reach this
# database only inside the operator's network, and moving those hops to TLS is a NAMED residue, not an accident.
#
# scram-sha-256, like the frame's (§DEPS 2a 2026-09-29): Postgres 18 without the md5 init lines stores SCRAM hashes
# (password_encryption = scram-sha-256, the image default; 18 deprecates MD5 passwords). Until 2026-09-29 this was
# md5, matching the md5 init measured on jelgava. Order matters: the first matching line decides.
local     all  all                          trust
hostnossl all  auditor_ro  0.0.0.0/0        reject
hostnossl all  auditor_ro  ::/0             reject
hostssl   all  auditor_ro  0.0.0.0/0        scram-sha-256 clientcert=verify-ca
hostssl   all  auditor_ro  ::/0             scram-sha-256 clientcert=verify-ca
host      all  all         127.0.0.1/32     scram-sha-256
host      all  all         ::1/128          scram-sha-256
host      all  all         all              scram-sha-256
