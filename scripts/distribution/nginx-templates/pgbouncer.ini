; A TEMPLATE: generate-operator-env.sh overwrites this file with real values (and writes userlist.txt).
[databases]
agentvault_registry = host=db port=5432 dbname=agentvault_registry user=registry password=SET_BY_generate-operator-env.sh

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; §SECFIX 2026-09-25: clients authenticate (SCRAM) against userlist.txt, which the generator writes.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; batch 2 (2026-09-05): console admin, so a boot-applied DDL is followed by RECONNECT instead of
; terminating idle backends (the R57 stale-plan class; paris measured 18 InvalidCachedStatementError)
admin_users = registry
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
ignore_startup_parameters = extra_float_digits,options
