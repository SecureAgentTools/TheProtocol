# =============================================================
# nginx mTLS Sidecar — Cloud-Operator TEG  (§2026-06-16 TEG-mTLS Phase 3)
# =============================================================
# Internal-only (operator-net) TLS-terminating reverse proxy in front of the
# operator's teg-layer. Presents the operator SPIRE SVID as server cert,
# validates the registry's client SVID (mTLS), and forwards the cert headers
# so the TEG's resolve_internal_caller() can authenticate Mode-1 (mTLS).
#
# Mirrors the mainframe nginx-teg-a sidecar. NOT host-exposed and NOT on the
# identity/federation networks — peers reach cross-teg via nginx-federation;
# this sidecar serves ONLY the local registry->TEG admin/proxy hop.
#
# Fleet-portable: upstream is the `teg-layer` service alias (present in every
# op compose), so this file is identical across all operators.
# =============================================================

# Health check server (plain HTTP, no mTLS)
server {
    listen 8080;
    server_name _;

    location /health {
        return 200 '{"status":"healthy","service":"nginx-teg-operator","mode":"mtls-sidecar"}\n';
        add_header Content-Type application/json;
    }
}

# Main server block — mTLS proxy for the operator TEG
server {
    listen 8443 ssl;
    server_name nginx-teg;

    # --- Server Certificate (SPIRE SVID from cert-writer) ---
    ssl_certificate       /certs/svid.0.pem;
    ssl_certificate_key   /certs/svid.0.key;

    # --- Client Certificate Verification (mTLS) ---
    # Trust bundle = SPIRE local CA + appended federated_bundle.*.pem (cross-frame).
    ssl_client_certificate /certs/bundle.0.pem;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    # --- TLS Protocol Settings ---
    ssl_protocols          TLSv1.3;
    ssl_ciphers            HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache      shared:SSL:1m;
    ssl_session_timeout    5m;

    # --- API Endpoints (all paths proxied to the local TEG) ---
    location /api/v1/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://${TEG_UPSTREAM_HOST}:8080;
        proxy_pass $upstream;

        # Match the host the TEG already accepts on the legacy plaintext path
        # (op registry dials http://${TEG_UPSTREAM_HOST}:8080). Avoids any TrustedHost reject.
        proxy_set_header Host              "teg-layer:8080";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Client cert forwarding for SPIFFE extraction in resolve_internal_caller().
        proxy_set_header X-SSL-Client-Cert   $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
        # §MTLSHOPS (2026-09-16): this operator's marker; the app counts X-SSL-* only with it (keep this file 600)
        #OPDIST-MARKER# proxy_set_header X-TEG-Proxy-Auth "__TEG_PROXY_TRUST_SECRET__";

        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    30s;
    }

    # --- Health (via mTLS — proves the cert path is valid) ---
    location /health {
        resolver 127.0.0.11 valid=10s;
        set $upstream_health http://${TEG_UPSTREAM_HOST}:8080;
        proxy_pass $upstream_health;
        proxy_set_header Host              "teg-layer:8080";
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        # §MTLSHOPS (2026-09-16): this operator's marker; the app counts X-SSL-* only with it (keep this file 600)
        #OPDIST-MARKER# proxy_set_header X-TEG-Proxy-Auth "__TEG_PROXY_TRUST_SECRET__";
    }

    # Catch-all
    location / {
        return 404 '{"error":"Use /api/v1/ endpoints"}\n';
        add_header Content-Type application/json;
    }
}
