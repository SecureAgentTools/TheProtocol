name: Bug report
description: Something does not work as the docs or the code say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Reproduce it on a sandbox frame (the kit stands one up in minutes), never on a production frame.
        A security vulnerability is not a bug report: the security policy says where to send it.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [registry, TEG layer, event store, directory, auditor, SDK, frontend, kit, docs, other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The registry card's software version (`/.well-known/registry-card.json`, identity.software_version), or the SDK or kit version.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The smallest set of steps on a sandbox frame. Leave out keys, passwords, tokens and personal data.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or responses
      description: The relevant lines only, with every secret removed.
      render: text
