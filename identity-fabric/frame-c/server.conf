server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    socket_path = "/tmp/spire-server/private/api.sock"
    trust_domain = "frame-c.theprotocol.cloud"
    data_dir = "/opt/spire/data/server"
    log_level = "INFO"

    ca_ttl = "168h"
    default_x509_svid_ttl = "4h"

    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port = 8443
        }
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }

    NodeAttestor "x509pop" {
        plugin_data {
            ca_bundle_path = "/opt/spire/conf/x509pop-certs/attestation-ca.crt"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }
}

# §pass20 (2026-05-16) — Prometheus telemetry for SPIRE alerting.
# Exposes spire_agent_* / spire_server_* metrics on :9988/metrics.
telemetry {
  Prometheus {
    host = "0.0.0.0"
    port = 9988
  }
}
