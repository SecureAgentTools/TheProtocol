agent {
    data_dir = "/opt/spire/data/agent"
    log_level = "INFO"
    server_address = "sandbox-c-spire-server"
    server_port = "8081"
    socket_path = "/opt/spire/sockets/agent.sock"
    trust_domain = "sandbox-c.test"
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "x509pop" {
        plugin_data {
            private_key_path = "/opt/spire/conf/x509pop-certs/agent-attestation.key"
            certificate_path = "/opt/spire/conf/x509pop-certs/agent-attestation.crt"
        }
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire/data/agent"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }

    WorkloadAttestor "docker" {
        plugin_data {
            docker_socket_path = "unix:///var/run/docker.sock"
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port = "8082"
    live_path = "/live"
    ready_path = "/ready"
}

# §pass20 (2026-05-16) — Prometheus telemetry for SPIRE alerting.
# Exposes spire_agent_* / spire_server_* metrics on :9988/metrics.
telemetry {
  Prometheus {
    host = "0.0.0.0"
    port = 9988
  }
}
