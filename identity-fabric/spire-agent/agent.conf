agent {
  data_dir = "/opt/spire/data"
  log_level = "INFO"
  server_address = "spire-server"
  server_port = "8081"
  socket_path = "/opt/spire/sockets/agent.sock"
  trust_bundle_path = "/opt/spire/conf/bundle.crt"
  trust_domain = "agentvault.com"
  admin_socket_path = "/opt/spire/admin/admin.sock"
}

plugins {
  NodeAttestor "x509pop" {
    plugin_data {
      private_key_path = "/opt/spire/conf/agent-attestation.key"
      certificate_path = "/opt/spire/conf/agent-attestation.crt"
    }
  }

  KeyManager "disk" {
    plugin_data {
      directory = "/opt/spire/data"
    }
  }

  WorkloadAttestor "unix" {
    plugin_data {}
  }

  WorkloadAttestor "docker" {
    plugin_data {
      docker_socket_path = "unix:///var/run/docker.sock"
    }
  }
}

health_checks {
  listener_enabled = true
  bind_address = "0.0.0.0"
  bind_port = "8082"
  live_path = "/live"
  ready_path = "/ready"
}

# §pass20 (2026-05-16) — Prometheus telemetry for SPIRE alerting.
# Exposes spire_agent_* metrics (SVID renew/rotate, bundle refresh, etc.)
# on :9988/metrics. Prometheus scrapes this from the agentvault_main_network
# via cross-network attachment. Internal only — port not exposed to host.
telemetry {
  Prometheus {
    host = "0.0.0.0"
    port = 9988
  }
}
