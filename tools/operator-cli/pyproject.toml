[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tp-operator"
version = "1.1.8"
description = "TheProtocol operator CLI — day-2 ops for federated/standalone registry stacks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TheProtocol", email = "support@theprotocol.cloud" }]
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "zstandard>=0.22.0",
    # §RELEASECHANNEL: Ed25519 verification of the signed release channel (tp_operator/release_channel.py)
    "cryptography>=41.0",
]

[project.optional-dependencies]
# `tp mcp serve` (tp_operator/mcp_serve.py): pip install '.[mcp]'
mcp = ["mcp>=1.27"]

[project.scripts]
tp-operator = "tp_operator.main:app"
# the umbrella (tp operator ..., tp mcp ...), as the tp binary (tp.spec) builds it
tp = "tp_operator.umbrella:umbrella"

[tool.setuptools.packages.find]
where = ["."]
include = ["tp_operator*"]
