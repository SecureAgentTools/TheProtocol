    <meta name="mobile-web-app-capable" content="yes">

    <meta name="theme-color" content="#07090d">

    <link href="/static/fonts/fonts.css" rel="stylesheet">

    <!-- ── SELF-HEAL (never a blank screen after a deploy) ──────────────────
         index.html is served no-store, so this inline script is ALWAYS fresh
         even when a stale/stuck service worker is serving old cached assets.
         If the SPA has not mounted a few seconds after load, it wipes every
         cache + unregisters every service worker and reloads ONCE (loop-guarded).
         Runs before the app bundle, depends on nothing it might fail to load. -->
    <script>
      (function () {
        var SW = ('serviceWorker' in navigator);
        var HEAL_KEY = 'tp_selfheal_at';
        function hardReset() {
          var jobs = [];
          try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
          try { if (SW) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
          return Promise.all(jobs).catch(function () {});
        }
        // Nudge any registered service worker to check for a fresher version on load.
        try { if (SW) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { try { r.update(); } catch (e) {} }); }); } catch (e) {}
        // Watchdog: mounted app => #app has children. If still empty after 10s,
        // assume a stale bundle / stuck worker and hard-reset, then reload once.
        window.addEventListener('load', function () {
          setTimeout(function () {
            var app = document.getElementById('app');
            if (app && app.children && app.children.length > 0) return; // healthy
            var last = 0; try { last = Number(sessionStorage.getItem(HEAL_KEY) || 0); } catch (e) {}
            if (Date.now() - last < 60000) return; // already healed recently — never loop
            try { sessionStorage.setItem(HEAL_KEY, String(Date.now())); } catch (e) {}
            hardReset().then(function () { window.location.reload(); });
          }, 10000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- §LEGALKIT: the legal notice is reachable even where scripts do not run (§ 5 DDG: directly reachable). -->
    <noscript><p style="font-family:sans-serif;font-size:13px;padding:12px"><a href="#/legal/imprint">Legal notice (Impressum)</a> · <a href="#/legal/privacy">Privacy</a> · <a href="#/legal/terms">Terms</a></p></noscript>
    <script type="module" src="/src/main.ts"></script>

    <!-- Loading indicator for initial load -->
    <style>
      #app:empty::before {
        content: '';
        position: fixed;
        top: 50%;
        left: 50%;
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
        border: 3px solid #1f2937;
        border-top-color: #00d4ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      /* Must equal the PWA manifest's background_color (vite.config.ts). The
         browser paints the splash in that colour and then hands over to this
         document; two different answers to "what colour is this app" made the
         boot flash between them. */
      body { background: #07090d; }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </body>
