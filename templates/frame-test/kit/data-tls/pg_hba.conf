# §MTLSHOPS T3 (2026-09-15, agentvault2-b5): the frame's Postgres takes TLS only from the network.
# Inside the container (docker exec psql, pg_isready, the entrypoint's first-boot init) the unix socket is trusted, as the
# image's own default is. Over TCP a connection without TLS is rejected, and a TLS connection needs a client certificate
# that chains to the data identity's bundle (the frame's own root: the data entry is never federated) and the role's
# password. verify-ca, not verify-full: an SVID carries no CN for Postgres to match against the role.
local     all  all                 trust
hostnossl all  all  0.0.0.0/0      reject
hostnossl all  all  ::/0           reject
hostssl   all  all  0.0.0.0/0      scram-sha-256 clientcert=verify-ca
hostssl   all  all  ::/0           scram-sha-256 clientcert=verify-ca
