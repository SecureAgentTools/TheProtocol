# templates/frame-test/console-vhost.example.conf — the CONSOLE vhost a fresh frame is pre-staged with (runbook §0.3 / §10.3b).
# Copy to /etc/nginx/sites-enabled/<slug>-theprotocol, replace {{SLUG}} {{REG_PORT}} {{ES_PORT}} {{PEER_SLUG}} {{PEER_ES_PORT}},
# issue the certificate (certbot webroot /var/www/html), `nginx -t`, reload. The standup driver only ENABLES it (enable_vhosts).
# §BATCH7b (2026-09-06): the SPA names its ledger sockets apex-style on every host it is served from —
#   /ws/events (Frame A's ledger on prod; here the frame's own), /ws/events-b, /ws/events-c, /ws/events-<slug>, /ws/events-<peer>.
#   A console that routes fewer than five sends the missing names to the registry's app socket and every visitor gets an
#   empty 403 on those columns while box-side probes pass. Gate: one handshake per name from a client that is not the box.
# {{SLUG}}.theprotocol.cloud
# Reverse-proxy to the sandbox registry container (127.0.0.1:{{REG_PORT}}).
# Issued + managed via Let's Encrypt webroot challenge (/var/www/html).

server {
    listen 80;
    listen [::]:80;
    server_name {{SLUG}}.theprotocol.cloud;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name {{SLUG}}.theprotocol.cloud;

    ssl_certificate     /etc/letsencrypt/live/{{SLUG}}.theprotocol.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{SLUG}}.theprotocol.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    # ACME renew only — registry-card.json / jwks / schema fall through to the
    # backend proxy below (matches sandbox-c).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # WebSocket upgrade for live features (api-tester, ledger stream).
    # 2026-05-24: Frontend connects to /api/v1/ws?token=... (no trailing slash);
    # the previous /api/v1/ws/ prefix did not match and fell through to the
    # catch-all without Upgrade headers. Mirror the prod api-theprotocol pattern.
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:{{REG_PORT}}/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Sandbox A EventStore WebSocket — for LandingPage's "Frame A" pane.
    # Direct to the sandbox A event-store (port 8204), no auth required.
    location /ws/events {
        proxy_pass http://127.0.0.1:{{ES_PORT}}/ws/events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Sandbox B EventStore WebSocket — for LandingPage's "Frame B" pane.
    location /ws/events-b {
        proxy_pass http://127.0.0.1:{{ES_PORT}}/ws/events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Frame C (Sandbox-C / BVT) EventStore WebSocket — MissionControl/Landing "Frame C" pane.
    location /ws/events-c {
        proxy_pass http://127.0.0.1:{{ES_PORT}}/ws/events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
    # §BATCH7b (2026-09-06) — the fresh network's ledgers on this console's live ledger strip. The SPA names them
    # apex-style (`/ws/events-juice`, `/ws/events-brrr`); without these two the catch-all `/ws/` sent them to the
    # registry's app socket, which has no such route, and Starlette answered an empty 403 to every visitor.
    # Same box today (loopback ports); on separate hosts the PEER's socket proxies to its public ES vhost instead
    # (`proxy_pass https://<peer>-es.theprotocol.cloud/ws/events; proxy_ssl_server_name on;`).
    location /ws/events-{{SLUG}} {   # this frame's own ledger, apex-style name
        proxy_pass http://127.0.0.1:{{ES_PORT}}/ws/events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # §BATCH9: the sandbox tier's two frames — a console that serves the app must route EVERY socket the FE
    # seeds name (a missing one answers the app's own socket route with an empty 403, the §BATCH8 console class).
    # apex-style (`/ws/events-juice`, `/ws/events-sbxalpha`); without these two the catch-all `/ws/` sent them to the
    # registry's app socket, which has no such route, and Starlette answered an empty 403 to every visitor.
    # Same box today (loopback ports); on separate hosts the PEER's socket proxies to its public ES vhost instead
    # (`proxy_pass https://<peer>-es.theprotocol.cloud/ws/events; proxy_ssl_server_name on;`).
    location /ws/events-{{SLUG}} {   # this frame's own ledger, apex-style name
        proxy_pass http://127.0.0.1:{{ES_PORT}}/ws/events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
    # apex-style (`/ws/events-juice`, `/ws/events-sbxbeta`); without these two the catch-all `/ws/` sent them to the
    # registry's app socket, which has no such route, and Starlette answered an empty 403 to every visitor.
    # Same box today (loopback ports); on separate hosts the PEER's socket proxies to its public ES vhost instead
    # (`proxy_pass https://<peer>-es.theprotocol.cloud/ws/events; proxy_ssl_server_name on;`).
    location /ws/events-{{SLUG}} {   # this frame's own ledger, apex-style name
        proxy_pass http://127.0.0.1:{{ES_PORT}}/ws/events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
    location /ws/events-{{PEER_SLUG}} {   # the FX peer's ledger
        proxy_pass http://127.0.0.1:{{PEER_ES_PORT}}/ws/events;   # separate hosts: proxy_pass https://{{PEER_SLUG}}-es.theprotocol.cloud/ws/events; proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Catch-all for other /ws/ paths (registry-side WS like astraeus spectator).
    # Path-rewrite /ws/ → /api/v1/ws/ since registry mounts WS router under /api/v1.
    location /ws/ {
        proxy_pass http://127.0.0.1:{{REG_PORT}}/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # MCP JSON-RPC bridge endpoints (Astraeus + all other game + discovery)
    location /mcp/ {
        proxy_pass http://127.0.0.1:{{REG_PORT}}/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Default: proxy everything else to the sandbox registry
    location / {
        proxy_pass http://127.0.0.1:{{REG_PORT}};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
