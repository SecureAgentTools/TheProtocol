[build-system]
# Pinned (2026-09-22): hatchling 1.28+ writes Metadata-Version 2.5, which twine 6.2.0 refuses to upload
# ("'2.5' is not a valid metadata version"); 1.27.0 writes 2.4, the version every published release carries.
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "theprotocol-sdk"
version = "0.11.1"
description = "Build sovereign AI agents with DID identity on TheProtocol. Speaks the A2A protocol (v1.0) natively, with bridges for Google A2A, ANP, and MCP. Works with Vertex AI, AWS AgentCore, LangGraph, CrewAI."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "TheProtocol", email = "sdk@theprotocol.cloud"},
]
keywords = ["agents", "a2a", "a2a-protocol", "agent-to-agent", "ai-agents", "mcp", "did", "sovereign", "federation", "vertex-ai", "langchain", "crewai", "fastapi", "json-rpc", "theprotocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "httpx[http2]>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.111"]
keyring = ["keyring>=24"]
anp = ["cryptography>=42.0"]
# TheProtocol Proxy (theprotocol.proxy, the tp-proxy command): the spec's YAML and its schema, the HTTP listeners, and
# the evidence export's signatures; an evidence export mirrored to SFTP or S3 adds one of the two below
proxy = ["pyyaml>=6.0", "jsonschema>=4.18", "aiohttp>=3.9", "cryptography>=42.0"]
# The QPU recipe (theprotocol.proxy.quantum): its simulator is pure python and needs nothing beyond the
# proxy extra. There is deliberately no accelerated-simulator extra here: an accelerated path we cannot
# run cannot be tested, so a bigger simulator or a real QPU client is installed by whoever has it and
# named in the spec as "module:Class" (see proxy/proxy.quantum.example.yaml).
proxy-quantum = ["theprotocol-sdk[proxy]"]
# The proxy's SFTP poll source (theprotocol.proxy.sources.sftp) and the evidence export's SFTP mirror: the SSH
# client, and XML read through defusedxml (the two proxy-sftp definitions joined, cut note 1)
proxy-sftp = ["theprotocol-sdk[proxy]", "paramiko>=3.4", "defusedxml>=0.7"]
proxy-s3 = ["theprotocol-sdk[proxy]", "boto3>=1.34"]
# the proxy's MQTT source (theprotocol.proxy.sources.mqtt): paho-mqtt 2 (its v2 callbacks and manual acknowledgement)
proxy-mqtt = ["theprotocol-sdk[proxy]", "paho-mqtt>=2.0,<3"]
# The proxy's SQL poll source (V0659 (m)): one database driver per engine, so a proxy installs only the one it reads
# (SQLite needs none). proxy-sql brings all three.
proxy-postgresql = ["theprotocol-sdk[proxy]", "psycopg[binary]>=3.1"]
proxy-mysql = ["theprotocol-sdk[proxy]", "pymysql[rsa]>=1.1"]          # rsa: MySQL 8.4's caching_sha2 login
proxy-sqlserver = ["theprotocol-sdk[proxy]", "pymssql>=2.3"]
proxy-sql = ["theprotocol-sdk[proxy-postgresql,proxy-mysql,proxy-sqlserver]"]
all = ["theprotocol-sdk[server,keyring,anp,proxy]"]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "cryptography>=42.0",
    "httpx>=0.27",
    # V0660 (a): the quantum workload models are checked against the shipped JSON Schema itself
    "jsonschema>=4.18",
]

[project.scripts]
tp-proxy = "theprotocol.proxy.cli:main"

# TheProtocol Proxy's sources found by their entry points, the way a community plugin is found (V0659 (m)). The core
# also knows its own as built-ins (theprotocol.proxy.plugins.BUILTINS), for a source checkout with nothing installed;
# an entry point that names the same class as a built-in is the same plugin.
[project.entry-points."theprotocol.proxy.sources"]
sqlpoll = "theprotocol.proxy.sources.sqlpoll:SqlPollSource"

[project.urls]
Homepage = "https://theprotocol.cloud"
Documentation = "https://docs.theprotocol.cloud"
"API Reference" = "https://api.theprotocol.cloud/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/theprotocol"]

# V0665: the three starter kits (tp-proxy migrate new --from-starter) ship inside the package. proxy/migrations/ is the ONE source: the wheel is built with
# them copied in, so a copy that differs from the source cannot exist (tests/test_proxy_migrate_from_starter.py builds the wheel and compares byte for byte).
# The files are named ONE BY ONE, not as three folders: a folder is copied whole, so a starter that was dry-run in place (its .migrate/ state folder)
# would ride into a wheel built from that tree. A new file in a kit must be added here: the wheel test fails, naming it, until it is. (The folder's own
# README and make_samples.py stay in the repo.) `git ls-files proxy/migrations/<kit>` is the list.
[tool.hatch.build.targets.wheel.force-include]
"proxy/migrations/csv-to-postgres/README.md" = "theprotocol/proxy/migrate/starter_kits/csv-to-postgres/README.md"
"proxy/migrations/csv-to-postgres/fake/make_export.py" = "theprotocol/proxy/migrate/starter_kits/csv-to-postgres/fake/make_export.py"
"proxy/migrations/csv-to-postgres/fake/make_target.py" = "theprotocol/proxy/migrate/starter_kits/csv-to-postgres/fake/make_target.py"
"proxy/migrations/csv-to-postgres/fake/target_postgresql.sql" = "theprotocol/proxy/migrate/starter_kits/csv-to-postgres/fake/target_postgresql.sql"
"proxy/migrations/csv-to-postgres/fake/target_sqlite.sql" = "theprotocol/proxy/migrate/starter_kits/csv-to-postgres/fake/target_sqlite.sql"
"proxy/migrations/csv-to-postgres/migration.yaml" = "theprotocol/proxy/migrate/starter_kits/csv-to-postgres/migration.yaml"
"proxy/migrations/csv-to-postgres/proxy.yaml" = "theprotocol/proxy/migrate/starter_kits/csv-to-postgres/proxy.yaml"
"proxy/migrations/csv-to-postgres/sample/orders.csv" = "theprotocol/proxy/migrate/starter_kits/csv-to-postgres/sample/orders.csv"
"proxy/migrations/sql-to-postgres/README.md" = "theprotocol/proxy/migrate/starter_kits/sql-to-postgres/README.md"
"proxy/migrations/sql-to-postgres/fake/make_legacy.py" = "theprotocol/proxy/migrate/starter_kits/sql-to-postgres/fake/make_legacy.py"
"proxy/migrations/sql-to-postgres/fake/make_target.py" = "theprotocol/proxy/migrate/starter_kits/sql-to-postgres/fake/make_target.py"
"proxy/migrations/sql-to-postgres/fake/target_postgresql.sql" = "theprotocol/proxy/migrate/starter_kits/sql-to-postgres/fake/target_postgresql.sql"
"proxy/migrations/sql-to-postgres/fake/target_sqlite.sql" = "theprotocol/proxy/migrate/starter_kits/sql-to-postgres/fake/target_sqlite.sql"
"proxy/migrations/sql-to-postgres/migration.yaml" = "theprotocol/proxy/migrate/starter_kits/sql-to-postgres/migration.yaml"
"proxy/migrations/sql-to-postgres/proxy.yaml" = "theprotocol/proxy/migrate/starter_kits/sql-to-postgres/proxy.yaml"
"proxy/migrations/sql-to-postgres/sample/customers.jsonl" = "theprotocol/proxy/migrate/starter_kits/sql-to-postgres/sample/customers.jsonl"
"proxy/migrations/sql-to-rest/README.md" = "theprotocol/proxy/migrate/starter_kits/sql-to-rest/README.md"
"proxy/migrations/sql-to-rest/fake/make_legacy.py" = "theprotocol/proxy/migrate/starter_kits/sql-to-rest/fake/make_legacy.py"
"proxy/migrations/sql-to-rest/fake/products_api.py" = "theprotocol/proxy/migrate/starter_kits/sql-to-rest/fake/products_api.py"
"proxy/migrations/sql-to-rest/migration.yaml" = "theprotocol/proxy/migrate/starter_kits/sql-to-rest/migration.yaml"
"proxy/migrations/sql-to-rest/proxy.yaml" = "theprotocol/proxy/migrate/starter_kits/sql-to-rest/proxy.yaml"
"proxy/migrations/sql-to-rest/sample/products.jsonl" = "theprotocol/proxy/migrate/starter_kits/sql-to-rest/sample/products.jsonl"

# Published-artifact provenance lives in dist_release/ for our own records; a
# source distribution has no business shipping PREVIOUS releases' binaries.
# Without this the 0.6.2 sdist carried the 0.5.1 and 0.6.1 wheels (636K vs a
# 104K wheel), and every future release would inherit the one before it.
[tool.hatch.build.targets.sdist]
exclude = ["dist_release", "dist", "htmlcov", ".pytest_cache"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
