# =============================================================
# nginx mTLS Sidecar — THE DIRECTORY  (§MTLSGAP 2026-09-08)
# =============================================================
# His question: *"i need to know if mtls is setup to directory otherwise we need to set this up
# too. everything is mtls enforced."* The answer was NO, in both directions: the Directory held
# no SVID (no /certs, no /spire mount, so it could not present one), sat on `directory_default`
# and no identity network, crawled the frames anonymously over the public vhost, and was read
# back by them over plain http on loopback.
#
# WHY THE READ LEG IS THE ONE THAT MATTERS. The Directory is the single component that AGGREGATES
# every frame's cards, and `DISCOVERY_VIA_DIRECTORY` means registries render what it returns. An
# unauthenticated index is a place to INJECT: before this, anything that could reach
# 127.0.0.1:8600 could shape what a person sees in Discovery. The crawl leg reads feeds that are
# public by design, so mutual auth there buys revocability and per-identity rate limiting; this
# leg buys the integrity of the answer.
#
# ⚠ Stands up ALONGSIDE the plain :8600, which is not removed by this file. Moving the console
# vhost onto the mTLS port is a separate, deliberate step, taken after a handshake has been
# proven with a real SVID — the same discipline the EventStore gateway got.
# =============================================================

# Health check server (plain HTTP, no mTLS) — this is what compose healthchecks. Deliberately NOT
# the mTLS port: a healthcheck that needs a client cert reports the CERT's state, not the proxy's.
server {
    listen 8080;
    server_name _;

    location /health {
        return 200 '{"status":"healthy","service":"nginx-directory","mode":"mtls-sidecar"}\n';
        add_header Content-Type application/json;
    }
}

server {
    listen 8443 ssl;
    server_name directory-nginx;

    # --- Server certificate (the Directory's own SPIRE SVID, written by its cert-writer) ---
    ssl_certificate       /certs/svid.0.pem;
    ssl_certificate_key   /certs/svid.0.key;

    # --- Client certificate verification (mTLS) ---
    # `on`, not `optional_no_ca`: this is the read leg, and an unverified caller must be refused
    # at the handshake rather than reach a query. The bundle carries EU's root plus the federated
    # ASIA root, so both frames' registries can read the index and nothing else can.
    ssl_client_certificate /certs/bundle.0.pem;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_ciphers            HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache      shared:SSL:1m;
    ssl_session_timeout    5m;

    location / {
        # `resolver` is REQUIRED: without it nginx resolves the upstream once at config load and
        # caches the IP for ever, so any Directory recreate becomes a permanent 502. Every sibling
        # sidecar in this fleet carries the same note, each after learning it the hard way.
        resolver 127.0.0.11 valid=10s;
        set $upstream http://directory:8600;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Client cert forwarding, so the Directory can log or later authorize by SPIFFE ID.
        proxy_set_header X-SSL-Client-Cert   $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;

        # mTLS is the authority on this hop: a caller must not be able to hand us a weaker one.
        proxy_set_header X-Internal-Key       "";
        proxy_set_header X-Federation-Secret  "";
        proxy_set_header X-Federation-License "";

        proxy_connect_timeout 15s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }
}
